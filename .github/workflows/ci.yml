name: CI

on: [push, pull_request]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the raw data
        run: python src/validate.py --path data/source/winequality-red.csv

      - name: Put the dataset where the pipeline reads it
        run: cp data/source/winequality-red.csv data/raw/

      - name: Run the pipeline
        run: dvc repro --force

      - name: Show the metrics
        run: dvc metrics show
      - name: Check the F1 threshold
        run: python src/check_f1.py